<style>
:root{--bg0:#f6ecee;--bg:rgba(255,255,255,.78);--sf:rgba(255,255,255,.72);--tx:#2a1218;--mu:#82606a;--bd:rgba(110,20,45,.14);--ac:#8b1e3f;--ac2:rgba(139,30,63,.1);--dg:#c2410c;--g1:#a4244a;--g2:#5c0f2a;--sh:0 8px 28px rgba(92,15,42,.16);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg0:#14070c;--bg:rgba(255,255,255,.06);--sf:rgba(255,255,255,.07);--tx:#f6e8ec;--mu:#bf9aa5;--bd:rgba(255,255,255,.12);--ac:#e0607f;--ac2:rgba(224,96,127,.16);--dg:#ffa07a;--g1:#9b2347;--g2:#5c0f2a;--sh:0 8px 28px rgba(0,0,0,.5);color-scheme:dark}

#app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}

.pri{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent;color:#fff}

.ci.on{border-color:var(--ac);background:var(--ac2);box-shadow:var(--sh)}
.av{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2))}
.av.big{width:54px;height:54px;font-size:24px}

small,.mu{color:var(--mu)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;margin:18px 0;flex-wrap:wrap;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:5px;width:fit-content;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.tabs button{border-color:transparent;background:transparent}
.tabs button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-color:transparent}
:root[data-theme="dark"] .tabs button.on{color:#0b1f19}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button.on{color:#0b1f19}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px;display:flex;flex-direction:column;box-shadow:var(--sh);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.card b{font-size:26px;font-weight:800;letter-spacing:-.5px}
.form{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:16px;box-shadow:var(--sh);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.form label{display:block;font-size:12px;color:var(--mu)}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:10px}
.scroll{overflow-x:auto;background:var(--sf);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;min-width:520px}

th{color:var(--mu);font-weight:500;font-size:12px}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph figure{margin:0;background:var(--sf);border:1px solid var(--bd);border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.ph img,.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.ph figcaption{padding:6px 8px;font-size:12px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px}
.cmp div{background:var(--sf);border:1px solid var(--bd);border-radius:18px;overflow:hidden;box-shadow:var(--sh)}
.cmp p{margin:0;padding:6px 8px;font-size:12px}
.wk{background:var(--sf);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.wk pre{margin:6px 0 0;white-space:pre-wrap;font:inherit}
.empty{padding:110px 10px;text-align:center;color:var(--mu);font-size:16px}
.back{display:none;margin-bottom:10px}
.warn{background:var(--ac2);border-radius:8px;padding:8px 10px;font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:5}
svg{width:100%;height:auto;display:block}
@media(max-width:720px){#app{grid-template-columns:1fr}aside{position:static;height:auto;min-height:100vh}main{padding:18px 14px}#app.sel aside{display:none}#app:not(.sel) main{display:none}.back{display:inline-block}}
.pass{background:var(--sf);border:1px solid var(--bd);border-left:5px solid var(--ac);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px}
.pass.warn{border-left-color:#d99a1e}.pass.bad{border-left-color:#d4442c}.pass.done{border-left-color:var(--mu);opacity:.75}
.bd{font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px;background:var(--ac2);color:var(--ac)}
.bd.warn{background:rgba(217,154,30,.18);color:#c58a10}.bd.bad{background:rgba(212,68,44,.16);color:#e0583f}.bd.done{background:var(--bd);color:var(--mu)}
.bar{height:8px;border-radius:99px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g1),var(--g2));border-radius:99px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips:empty{display:none}
.ch{font-size:12px;padding:3px 4px 3px 10px;border-radius:99px;background:var(--ac2);color:var(--ac);display:inline-flex;gap:3px;align-items:center;font-weight:700}
.ch.x{background:rgba(212,68,44,.14);color:#e0583f}.ch b{cursor:pointer;padding:0 6px;opacity:.7;font-size:14px}
.big{font-size:32px;font-weight:800;line-height:1}.lnk{cursor:pointer}.lnk:hover{text-decoration:underline}
summary{cursor:pointer;font-weight:800}.pl{display:grid;grid-template-columns:1fr 100px;gap:8px;align-items:center;margin-top:8px}
.pass .row input[type=date]{width:auto}
.pri,.tabs button.on,.av{color:#fff!important}

/* Keep forms within the viewport, including Safari date inputs. */
.fg>*{min-width:0}.row>*{min-width:0}h2{overflow-wrap:anywhere}
.client-head{align-items:flex-start}.client-title{flex:1;flex-wrap:nowrap;min-width:0}
.client-title h2{min-width:0}.client-tabs{max-width:100%}
input[type=date]{min-width:0;max-width:100%;min-height:44px}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.5em}
.nutrition-intro{margin:0 0 16px;color:var(--mu)}
@media(max-width:720px){
 #app{min-height:100dvh}aside{min-height:100dvh}
 main{padding:16px max(14px,env(safe-area-inset-right)) 24px max(14px,env(safe-area-inset-left));max-width:100%}
 h2{font-size:23px}.client-head{gap:12px}.client-head>button{margin-left:auto}

 .pass>.row:first-child{flex-wrap:wrap!important}.pass>.row:first-child>div:first-child{flex:1 1 180px;overflow-wrap:anywhere}

}

.nutrition-section{margin-top:20px}.calc-wide{grid-column:1/-1}.calc-checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}.calc-checks label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--bd);padding:10px;border-radius:12px;color:var(--tx);font-size:14px}.calc-checks input{width:20px;height:20px;flex:none;margin-top:1px}.calc-result{margin-top:16px}.calc-result .warn{display:block;margin:8px 0}.calc-result ul{padding-left:20px}.calc-help{font-size:13px;color:var(--mu);margin:8px 0 14px}.calc-inputs label{margin-bottom:4px}.calc-actions{margin-top:12px}.calc-result .grid{margin:14px 0}.nutrition-history{padding:12px 0;border-bottom:1px solid var(--bd)}.nutrition-history summary{font-size:14px;overflow-wrap:anywhere}.nutrition-history p{overflow-wrap:anywhere}.nutrition-section a{color:var(--ac)}.nutrition-section select{max-width:100%}.calc-section-title{font-size:18px;margin:0 0 10px}.calc-checks fieldset{min-width:0}

.cancel-reason{width:auto;max-width:100%}

@media(max-width:720px){.measurement-date input,.payment-date input{max-width:100%}}
</style>

<body>
<div id="app">
<aside>
<div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div><h1>Annergy</h1><br><small>Журнал тренера</small></div><button id="th" title="Сменить тему" style="padding:6px 10px">☀️</button></div>
<div class="tabs" id="nav" style="margin:0;width:auto"><button data-a="nav" data-id="c" style="flex:1">Клиенты</button><button data-a="nav" data-id="s" style="flex:1">Абонементы</button></div>
<input id="q" placeholder="Поиск по имени…" autocomplete="off">
<div id="list" style="overflow:auto;flex:1"></div>

<div class="row"><button data-a="exp" style="flex:1" title="Скачать резервную копию">⬇ Экспорт</button><button data-a="imp" style="flex:1" title="Загрузить резервную копию">⬆ Импорт</button><input type="file" id="impf" accept=".json,application/json" hidden></div>
</aside>

</div>

<script>
const $=s=>document.querySelector(s);
let th='dark';try{th=localStorage.getItem('th')||'dark'}catch(_){}
const applyTh=()=>{document.documentElement.dataset.theme=th;$('#th').textContent=th==='dark'?'☀️':'🌙'};
applyTh();
$('#th').addEventListener('click',()=>{th=th==='dark'?'light':'dark';try{localStorage.setItem('th',th)}catch(_){}applyTh()});
const M=[['weight','Вес, кг'],['chest','Грудь, см'],['waist','Талия, см'],['hips','Бёдра, см'],['arm','Бицепс, см'],['thigh','Бедро, см'],['underBust','Под грудью, см'],['underWaist','Под талией, см'],['legLeft','Нога левая, см'],['legRight','Нога правая, см'],['thighLeft','Бедро левое, см'],['thighRight','Бедро правое, см'],['armLeft','Бицепс левый, см'],['armRight','Бицепс правый, см']];
const PT={b:'До',p:'Прогресс',a:'После'};
let col=null,assets=null,clients={},sel=null,tab='m',metric='weight',q='',loaded=false,delc=false;

function estimateNutrition(p){
 const errors=[],clinical=[];const number=k=>p[k]!==''&&p[k]!=null&&Number.isFinite(Number(p[k]))?Number(p[k]):NaN;
 const age=number('age'),height=number('height'),weight=number('weight'),activity=number('activity'),proteinPct=number('proteinPct'),fatPct=number('fatPct'),carbsPct=100-proteinPct-fatPct;
 if(!Number.isInteger(age)||age<1||age>120)errors.push('Укажите возраст целым числом от 1 до 120 лет.');
 if(!(height>=100&&height<=250))errors.push('Укажите рост от 100 до 250 см.');
 if(!(weight>=25&&weight<=350))errors.push('Укажите текущий вес от 25 до 350 кг.');
 if(!['female','male'].includes(p.sex))errors.push('Выберите вариант формулы по полу.');
 if(!NC_ACTIVITY.some(a=>Number(a[0])===activity))errors.push('Выберите суммарную активность с учётом работы и тренировок.');
 if(!['lose','maintain','gain'].includes(p.goal))errors.push('Выберите цель.');
 if(!(proteinPct>=10&&proteinPct<=35&&fatPct>=20&&fatPct<=35&&carbsPct>=45&&carbsPct<=65))errors.push('Распределение: белки 10–35%, жиры 20–35%, углеводы (остаток) 45–65%.');
 if(!['none','present'].includes(p.healthStatus))clinical.push('Сначала уточните состояние здоровья клиента.');
 if(!['none','taking'].includes(p.medicationStatus))clinical.push('Сначала уточните приём лекарств.');
 if(Number.isFinite(age)&&(age<18||age>78))clinical.push('Вне возраста 18–78 лет нужен индивидуальный расчёт специалиста.');
 if(p.healthStatus==='present'||(p.conditions||[]).length||String(p.healthNotes||'').trim())clinical.push('При заболеваниях и особых состояниях нужны цели, согласованные с врачом или диетологом.');
 if(p.medicationStatus==='taking'||String(p.medications||'').trim())clinical.push('При приёме лекарств потребность в питании и ограничения нужно сверить с лечащим специалистом.');
 const bmi=weight/(height/100)**2;
 if(Number.isFinite(bmi)&&bmi<18.5)clinical.push('При недостаточной массе тела нужен индивидуальный план специалиста.');
 if(errors.length||clinical.length)return {ok:false,errors,clinical};
 const resting=10*weight+6.25*height-5*age+(p.sex==='male'?5:-161);
 const maintenance=resting*activity,factor={lose:.9,maintain:1,gain:1.05}[p.goal],calories=Math.round(maintenance*factor/10)*10;
 if(calories<1200)return {ok:false,errors:[],clinical:['Оценка ниже 1200 ккал/сутки: автоматическая цель не формируется, нужен специалист. Это ограничение калькулятора, а не универсальная безопасная норма.']};
 return {ok:true,resting:Math.round(resting),maintenance:Math.round(maintenance),calories,protein:Math.round(calories*proteinPct/100/4),fat:Math.round(calories*fatPct/100/9),carbs:Math.round(calories*carbsPct/100/4),proteinPct,fatPct,carbsPct,activity,goal:p.goal,method:'Mifflin–St Jeor',bmi};
}

const fmtR=n=>(+n).toLocaleString('ru-RU')+' ₽';

const usedSessions=s=>s.v.length+s.x.filter(d=>s.reasons?.[d]==='absence').length;
function setSessionStatus(s,date,status){
  const oldCharge=Number(s.v.includes(date))+Number(s.x.includes(date)&&s.reasons?.[date]==='absence');
  const newCharge=Number(status==='visit'||status==='absence');
  if(newCharge>oldCharge&&usedSessions(s)-oldCharge+newCharge>s.pk)return false;
  s.v=s.v.filter(d=>d!==date);
  s.x=s.x.filter(d=>d!==date);
  s.reasons={...s.reasons};
  delete s.reasons[date];
  if(status==='visit')s.v.push(date);
  else{s.x.push(date);s.reasons[date]=status;}
  s.v.sort();s.x.sort();
  return true;
}

async function shrink(f){
  const b=await createImageBitmap(f),s=Math.min(1,1200/Math.max(b.width,b.height)),cv=document.createElement('canvas');
  cv.width=Math.round(b.width*s);cv.height=Math.round(b.height*s);cv.getContext('2d').drawImage(b,0,0,cv.width,cv.height);
  return new Promise(r=>cv.toBlob(r,'image/jpeg',.82));
}

document.addEventListener('change',async e=>{
  const i=e.target.id,c=clients[sel];
  if(i==='impf'){const f=e.target.files[0];if(f&&confirm('Заменить текущие данные данными из файла?')){try{await importAll(f);toast('Данные загружены')}catch(_){toast('Не удалось прочитать файл')}}e.target.value=''}
  else if(i==='metric'){metric=e.target.value;render()}
  else if(i==='pf'||i==='pt'||i==='cut'){cfg[i]=i==='cut'?+e.target.value:e.target.value;await saveCfg();render()}
  else if(i==='rp'||i==='rd'){cfg.rent[cfg.pf+'|'+cfg.pt]={p:$('#rp').checked,d:val('rd')};await saveCfg()}
  else if(i==='cnote'){cfg.note=e.target.value;await saveCfg()}
  else if(e.target.dataset.pl!==undefined){cfg.pl[+e.target.dataset.pl].c=+e.target.value;await saveCfg()}
  else if(i==='np_pr'){const x=cfg.pl[+e.target.value];if(e.target.value!==''&&x){$('#np_pk').value=x.pk;$('#np_c').value=x.c}syncSingleVisitField()}
  else if(c&&i.startsWith('nutrition_')){const key=i.slice(10);if(!['calories','protein','fat','carbs','notes'].includes(key))return;if(key!=='notes'&&!e.target.validity.valid)return toast('Введите число не меньше нуля');c.nutrition={...(c.nutrition||{}),[key]:e.target.value,origin:'manual',updatedAt:new Date().toISOString()};const status=$('#nutrition-origin');if(status)status.textContent='Цели изменены вручную';if(col)await col.doc(c.id).set(c);toast('КБЖУ сохранено')}
  else if(c&&(i==='c_g'||i==='c_h'||i==='c_age'||i==='c_n'||i==='c_p')){if(!e.target.validity.valid)return toast('Проверьте значение');c[{c_g:'g',c_h:'h',c_age:'age',c_n:'n',c_p:'ph'}[i]]=e.target.value;clients[c.id]=c;if(col)try{await col.doc(c.id).set(c)}catch(_){toast('Не удалось сохранить')}}
});
document.addEventListener('input',e=>{if(e.target.id==='np_pk')syncSingleVisitField()});
$('#q').addEventListener('input',e=>{q=e.target.value;render()});
/* ---------- Локальное хранилище: localStorage (данные) + IndexedDB (фото) ---------- */
const LS='trainer-journal-v1',PURL={};
let store={};try{store=JSON.parse(localStorage.getItem(LS)||'{}')}catch(_){}
const persist=()=>{try{localStorage.setItem(LS,JSON.stringify(store))}catch(_){toast('Память браузера заполнена — сделайте экспорт')}};
col={doc:id=>({set:async d=>{store[id]=JSON.parse(JSON.stringify(d));persist()},delete:async()=>{delete store[id];persist()}})};
const idb=()=>new Promise((r,j)=>{const q=indexedDB.open('trainer-journal',1);q.onupgradeneeded=()=>q.result.createObjectStore('ph');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
const tx=async(m,f)=>{const d=await idb();return new Promise((r,j)=>{const t=d.transaction('ph',m),q=f(t.objectStore('ph'));t.oncomplete=()=>r(q&&q.result);t.onerror=()=>j(t.error)})};
const PU=id=>PURL[id]||'';
assets={upload:async b=>{const id=nid();await tx('readwrite',o=>o.put(b,id));PURL[id]=URL.createObjectURL(b);return{id}},delete:async id=>{await tx('readwrite',o=>o.delete(id));delete PURL[id]}};
async function allPh(){try{const d=await idb();return await new Promise(r=>{const out={},o=d.transaction('ph').objectStore('ph').openCursor();o.onsuccess=()=>{const c=o.result;if(c){out[c.key]=c.value;c.continue()}else r(out)};o.onerror=()=>r(out)})}catch(_){return{}}}
async function loadPh(){const p=await allPh();for(const k in p)PURL[k]=URL.createObjectURL(p[k])}
const b2u=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function exportAll(){const ph=await allPh(),photos={};for(const k in ph)photos[k]=await b2u(ph[k]);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({v:1,store,photos})],{type:'application/json'}));a.download='trainer-journal-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)}
async function importAll(f){const j=JSON.parse(await f.text());if(!j.store)throw 0;store=j.store;persist();
  for(const k in j.photos||{}){const b=await(await fetch(j.photos[k])).blob();await tx('readwrite',o=>o.put(b,k));PURL[k]=URL.createObjectURL(b)}
  hydrate();sel=null;render()}
function hydrate(){clients={};cfg=DEF();Object.entries(store).forEach(([id,x])=>{x=JSON.parse(JSON.stringify(x));if(id==='_cfg'){cfg={...DEF(),...x,rent:x.rent||{}};return}
  x.m=x.m||[];x.p=x.p||[];x.w=x.w||[];x.ph=x.ph||'';x.s=(x.s||[]).map(p=>({...p,v:p.v||[],x:p.x||[]}));clients[id]=x})}
hydrate();render();
loadPh().finally(()=>{loaded=true;render()});
</script>
